name: Mantener Supabase activo

on:
  schedule:
    - cron: '23 13 */2 * *'
  workflow_dispatch: {}

jobs:
  mantener:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar la base para que no se pause por inactividad
        env:
          URL: https://ezdbvudlqwcuzutdfaij.supabase.co
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZGJ2dWRscXdjdXp1dGRmYWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDU4MjcsImV4cCI6MjEwODA4MTgyN30.EkCTB5_9qOufNwY6yIm1h3SI0xO7_1FT55lWjz1vjys
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/iniciar_sesion" -H "apikey: $ANON" -H "Content-Type: application/json" -d '{"p_documento":"0","p_clave":"0"}')
          echo "Respuesta de la base: $codigo"
          if [ "$codigo" -ge 500 ] || [ "$codigo" -eq 000 ]; then exit 1; fi
