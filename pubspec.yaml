name: repuestos_pos
description: "Sistema de ventas, compras e inventario de Repuestos POS"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  supabase_flutter: ^2.10.4
  connectivity_plus: ^6.1.5
  go_router: ^17.3.0
  intl: 0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  excel: ^4.0.6
  archive: ^3.6.1
  printing: ^5.14.3
  pdf: ^3.12.0
  barcode: ^2.2.9
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  fl_chart: ^0.69.0
  image: ^4.1.2
  mobile_scanner: ^7.1.2
  esc_pos_utils_plus: ^2.0.4
  qr_flutter: ^4.1.0
  http: ^1.2.2
  open_file: ^3.5.10
  win32: ^5.15.0
  ffi: ^2.2.0
  print_bluetooth_thermal: ^1.2.4
  tutorial_coach_mark: ^1.3.4
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icono/icono.png
  adaptive_icon_background: "#303846"
  adaptive_icon_foreground: assets/icono/icono_primer_plano.png
  web:
    generate: true
    image_path: assets/icono/icono.png
    background_color: "#303846"
    theme_color: "#303846"
  windows:
    generate: true
    image_path: assets/icono/icono.png
    icon_size: 256
